name: Run MATLAB Tests

on:
  push:
    branches:
      - '**' 
  pull_request:
    branches:
      - '**' 

jobs:
  test:
    name: Run MATLAB Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: latest

      - name: Show repository layout
        run: |
          pwd
          find . -maxdepth 3 -type d | sort
          find . -maxdepth 4 -name "*.m" | sort

      - name: Run MATLAB tests
        uses: matlab-actions/run-tests@v3
        with:
          test-results-junit: test-results/results.xml
          code-coverage-cobertura: code-coverage/coverage.xml
          source-folder: src/octave
          select-by-folder: tests/matlab
          strict: false
          use-parallel: false
          generate-summary: true
          output-detail: verbose
          logging-level: verbose

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matlab-test-results
          path: test-results/results.xml

      - name: Upload code coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matlab-code-coverage
          path: code-coverage/coverage.xml

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Full git history is needed to get a proper
          # list of changed files within `super-linter`
          fetch-depth: 0

      - name: Install system deps
        run: |
          wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          sudo add-apt-repository "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-20 main"
          sudo apt-get update
          sudo apt-get install -y octave

      - name: Run Octave tests
        run: |
          cd tests/octave
          octave --quiet --eval "oruntests('.')"
